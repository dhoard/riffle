name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every JDK in the matrix instead of cancelling siblings on first failure.
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Use the wrapper so CI builds with the Maven version pinned in .mvn/wrapper.
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
